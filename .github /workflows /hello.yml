# Goal: To say Hello in the workflow and tell the title/name or repository

# Start with naming your workflow
name: Hello

# when the worflow runs
on: 
push:
  branches: [main]

# what the workflow does  
jobs: 
# name of your jobs
  greet: 
# where the job runs (OS) 
    runs-on: ubuntu-latest
# the sequence of the steps the job does    
    steps: 
     - name: Say Hello
      run: echo "Hello Doston"
