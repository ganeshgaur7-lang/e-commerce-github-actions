name: Show envoirnment variable

on: 
 workflow_dispatch:
  inputs:
    environment:
     description: "Choose deployment environment"
     required: true
     type: choice
     options:
       - dev
       - stg
       - prd
env:
  Name: Ganesh
  
jobs:
  show_env:
   runs-on: ubuntu-latest
   steps:
     - name: Show plain text env
       run: echo "my name is $Name"
     - name: show my secrets
       run: echo "my secret is ${{ secrets.GANESH_SECRETS }}"
     - name: show variable
       run: echo "my github account name is ${{ vars.Ganesh_Github_account }}"
